apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: pharmago
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
    - job_name: otlp-collector
      honor_labels: true
      static_configs:
      - targets: ['otlp-collector:8889']
    # Conservar up para las alertas del PR #5; las metricas funcionales llegan por OTLP.
    - job_name: users-service
      static_configs:
      - targets: ['pharmago-users-service:80']
      metric_relabel_configs:
      - source_labels: [__name__]
        regex: '.*'
        action: drop
    # Conservar up para las alertas del PR #5; las metricas funcionales llegan por OTLP.
    - job_name: pharmacy-service
      static_configs:
      - targets: ['pharmago-pharmacy-service:80']
      metric_relabel_configs:
      - source_labels: [__name__]
        regex: '.*'
        action: drop
    # Conservar up para las alertas del PR #5; las metricas funcionales llegan por OTLP.
    - job_name: api-gateway
      static_configs:
      - targets: ['pharmago-api-gateway:80']
      metric_relabel_configs:
      - source_labels: [__name__]
        regex: '.*'
        action: drop
