apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharmago-users-service
  namespace: pharmago
spec:
  replicas: 2
  template:
    spec:
      affinity:
        $patch: replace
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-type
                operator: In
                values: [backend]
        # Las replicas del mismo servicio comparten nodo (afinidad hacia si mismo): con 3 nodos backend
        # y antiafinidad entre servicios, evita que un servicio ocupe 2 nodos y deje a otro en Pending.
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values: [pharmago-users-service]
            topologyKey: kubernetes.io/hostname
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values: [pharmago-api-gateway, pharmago-pharmacy-service]
            topologyKey: kubernetes.io/hostname
