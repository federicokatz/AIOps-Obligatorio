apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-node-agent
  namespace: pharmago
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-node-agent
rules:
- apiGroups: [""]
  resources: ["nodes/proxy"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-node-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-node-agent
subjects:
- kind: ServiceAccount
  name: otel-node-agent
  namespace: pharmago
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-node-agent-discovery
  namespace: pharmago
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-node-agent-discovery
  namespace: pharmago
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-node-agent-discovery
subjects:
- kind: ServiceAccount
  name: otel-node-agent
  namespace: pharmago
