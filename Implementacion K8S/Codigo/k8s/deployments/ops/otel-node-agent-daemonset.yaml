apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-node-agent
  namespace: pharmago
spec:
  selector:
    matchLabels:
      app: otel-node-agent
  template:
    metadata:
      labels:
        app: otel-node-agent
    spec:
      serviceAccountName: otel-node-agent
      # Recolectar tambien nodos reservados para backend y control-plane.
      tolerations:
      - operator: Exists
      containers:
      - name: otel-node-agent
        image: otel/opentelemetry-collector-contrib:0.123.0
        args: ["--config=/etc/otel/agent.yaml"]
        env:
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: K8S_NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        volumeMounts:
        - name: config
          mountPath: /etc/otel/agent.yaml
          subPath: agent.yaml
      volumes:
      - name: config
        configMap:
          name: otel-node-agent-config
